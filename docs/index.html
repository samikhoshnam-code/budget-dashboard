<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>داشبورد مدیریتی بودجه، تولید و فروش</title>
<style>
:root{--bg:#F4F6FA;--card:#fff;--ink:#1F2A44;--mut:#6B7694;--line:#D5DCE8;--nav:#0B4F8A;--kpi:#2F3A8F;--b:#1B4F8A;--o:#FF7F0E;--track:#E3E8F1;--q:#8FA3BF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0F1626;--card:#18213A;--ink:#E6EBF5;--mut:#9AA6C4;--line:#2B3656;--nav:#0B3A66;--b:#5B9BE0;--track:#26314F;--q:#6C7FA3}}
[hidden]{display:none!important}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI",Tahoma,Vazirmatn,sans-serif}
header{background:var(--nav);color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
header h1{margin:0;font-size:26px}header small{opacity:.85;display:block;font-size:13px}
.tabs{display:flex;gap:10px;flex-wrap:wrap}.tabs button,.reset{font:inherit;font-size:15px;color:#fff;background:transparent;border:2px solid #fff;border-radius:16px;padding:8px 20px;cursor:pointer;font-weight:600}
.tabs button.on{background:#fff;color:var(--nav)}
main{padding:18px 28px 32px;max-width:1500px;margin:auto}
.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.f{border:2px solid var(--b);border-radius:12px;padding:6px 12px;background:var(--card)}.f label{display:block;color:var(--b);font-weight:700;font-size:14px}
.f select{border:0;background:transparent;color:var(--ink);font:inherit;min-width:190px}.f.chk{display:flex;gap:10px;align-items:center;font-weight:600}
.reset{color:var(--b);border-color:var(--b);border-radius:12px;padding:12px 24px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:16px}
.kpi{background:var(--kpi);color:#fff;border-radius:40px;padding:22px 12px;text-align:center}.kpi b{display:block;font-size:38px;line-height:1.2}.kpi span{font-size:15px;opacity:.92}.kpi.hot b{color:#FFB066}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.w2{grid-column:1/-1}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px;min-height:340px}.p h2{margin:0 0 12px;font-size:19px;text-align:center}
.row{display:grid;grid-template-columns:190px 1fr 84px;gap:12px;align-items:center;margin:9px 0;cursor:pointer}.row.dim{opacity:.35}.row:hover .l{text-decoration:underline}
.t{height:26px;background:var(--track);border-radius:6px;position:relative}.t i{position:absolute;right:0;border-radius:6px;top:0;height:100%}
.bud{background:var(--mut);opacity:.45}.act{height:12px!important;top:7px!important;background:var(--b)}.act.over{background:var(--o)}
.l,.v{font-size:15px}.v{text-align:left;font-variant-numeric:tabular-nums;font-weight:600}
.leg{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;font-size:14px;color:var(--mut);margin-top:10px}.leg s{display:inline-block;width:14px;height:14px;border-radius:3px;margin-left:6px}
.ins ul{padding:0;margin:0}.ins li{list-style:none;background:var(--bg);border-radius:8px;padding:12px 14px;margin:10px 0;color:var(--b);font-weight:600;font-size:16px}
svg{display:block;width:100%;height:auto}svg text{fill:var(--mut);font-size:13px}svg .vl{fill:var(--ink);font-size:13px;font-weight:600}svg .ax{stroke:var(--line)}
.note{color:var(--mut);font-size:13px;margin:12px 0;text-align:center}
table{width:100%;border-collapse:collapse}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;font-size:15px}th{color:var(--b)}
.tag{background:var(--o);color:#fff;border-radius:8px;padding:2px 12px;font-size:13px}
#login{position:fixed;inset:0;background:var(--nav);display:flex;align-items:center;justify-content:center;z-index:9}
#login form{background:var(--card);padding:34px;border-radius:16px;width:min(400px,90vw);text-align:center}
#login input{width:100%;padding:12px;margin:14px 0;border:2px solid var(--b);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
#login button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--kpi);color:#fff;font:inherit;font-weight:700;cursor:pointer}
#err{color:#C0392B;min-height:20px}
@media(max-width:1000px){.grid{grid-template-columns:1fr}.row{grid-template-columns:130px 1fr 70px}}
</style></head><body>
<div id="login"><form id="lf"><h2 style="margin:0">داشبورد مدیریتی</h2><p class="note">برای دیدن داده‌ها رمز را وارد کنید.</p>
<input type="password" id="pw" autocomplete="current-password" placeholder="رمز عبور" aria-label="رمز عبور"><div id="err" role="alert"></div><button>ورود</button></form></div>
<header><div><h1>داشبورد بودجه، تولید و فروش</h1><small id="upd"></small></div><div class="tabs" id="tabs"></div></header>
<main id="app" hidden>
<div class="filters" id="flt">
<div class="f"><label for="mon">ماه</label><select id="mon"></select></div>
<div class="f"><label for="cat">دسته</label><select id="cat"></select></div>
<div class="f chk"><input type="checkbox" id="over" style="width:18px;height:18px"><label for="over" style="color:var(--ink);font-size:15px">فقط بالاتر از بودجه</label></div>
<button class="reset" id="rs">پاک‌کردن فیلترها</button></div>
<div id="view"></div></main>
<script>
const $=s=>document.getElementById(s),f=(n,d=1)=>Number(n).toLocaleString('fa-IR',{maximumFractionDigits:d});
const COL=['#1B4F8A','#FF7F0E','#3B3F9E','#0F8BFF','#6A0F7A','#E5703A','#2E9E8F','#8FA3BF','#C0392B','#F2B134'];
const TABS=[['ov','بودجه'],['rv','اقلام نیازمند تایید'],['sl','فروش'],['pr','تولید']];
let D,sel='',over=false,tab='ov',mk='';
async function dec(pw){const e=await (await fetch('data.enc?'+Date.now())).json(),b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(e.s),iterations:e.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(e.i)},k,b(e.c))))}
async function open_(pw){try{D=await dec(pw);sessionStorage.setItem('k',pw)}catch(x){sessionStorage.removeItem('k');$('err').textContent='رمز نادرست است یا داده در دسترس نیست.';return}
 $('login').hidden=true;$('app').hidden=false;init()}
$('lf').onsubmit=e=>{e.preventDefault();open_($('pw').value)};
const sk=sessionStorage.getItem('k');if(sk)open_(sk);
function init(){$('upd').textContent='آخرین تراکنش: '+D.lastTx+' | به‌روزرسانی: '+D.updated;
 mk=[...D.order].reverse().find(m=>D.months[m].n>0)||D.order[D.order.length-1];$('mon').innerHTML=D.order.map(m=>`<option value="${m}">${D.months[m].label}</option>`).join('');$('mon').value=mk;
 $('mon').onchange=()=>{mk=$('mon').value;sel='';draw()};
 $('tabs').innerHTML=TABS.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join('');
 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
 $('over').onchange=e=>{over=e.target.checked;draw()};$('cat').onchange=()=>{sel=$('cat').value;draw()};
 $('rs').onclick=()=>{sel='';over=false;$('over').checked=false;draw()};draw()}
const kp=(b,s,h)=>`<div class="kpi ${h?'hot':''}"><b>${b}</b><span>${s}</span></div>`;
const leg=a=>`<div class="leg">${a.map(x=>`<span><s style="background:${x[1]}"></s>${x[0]}</span>`).join('')}</div>`;
const wrap=(s,n=11)=>{const w=s.split(' '),L=[''];w.forEach(x=>{if((L[L.length-1]+' '+x).trim().length>n&&L[L.length-1])L.push(x);else L[L.length-1]=(L[L.length-1]+' '+x).trim()});return L};
// نمودار ستونی عمودی: series=[{n,c,v:[...],cc:[رنگ هر ستون، اختیاری]}], stacked برای انباشته
function vchart(labels,series,o={}){const W=1000,H=o.h||430,pl=20,pr=20,pt=34,pb=78,n=labels.length,gw=(W-pl-pr)/Math.max(n,1),ns=series.length;
 const tot=labels.map((_,i)=>o.stacked?series.reduce((s,x)=>s+(x.v[i]||0),0):Math.max(...series.map(x=>x.v[i]||0)));
 const mx=Math.max(...tot,1)*1.12,y=v=>pt+(H-pt-pb)*(1-v/mx),bw=o.stacked?gw*.6:gw*.7/ns;let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
 for(let k=0;k<=4;k++){const yy=pt+(H-pt-pb)*k/4;s+=`<line class="ax" x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text x="${W-pr}" y="${yy-4}" text-anchor="end">${f(mx*(1-k/4),0)}</text>`}
 labels.forEach((lb,i)=>{const cx=W-pr-(i+.5)*gw;let base=0;
  series.forEach((sr,j)=>{const v=sr.v[i]||0,x=o.stacked?cx-bw/2:cx-ns*bw/2+(ns-1-j)*bw,y0=o.stacked?y(base+v):y(v),hh=o.stacked?y(base)-y(base+v):y(0)-y(v);
   s+=`<rect x="${x}" y="${y0}" width="${bw}" height="${Math.max(hh,0)}" rx="4" style="fill:${(sr.cc&&sr.cc[i])||sr.c}"><title>${lb} – ${sr.n}: ${f(v,1)}</title></rect>`;
   if(!o.stacked&&v>0)s+=`<text class="vl" x="${x+bw/2}" y="${y0-6}" text-anchor="middle">${f(v,0)}</text>`;base+=v});
  if(o.stacked&&tot[i]>0)s+=`<text class="vl" x="${cx}" y="${y(tot[i])-6}" text-anchor="middle">${f(tot[i],0)}</text>`;
  wrap(lb).forEach((ln,k)=>s+=`<text x="${cx}" y="${H-pb+22+k*17}" text-anchor="middle" style="fill:var(--ink)">${ln}</text>`)});
 return s+'</svg>'}
function donut(items,tot,selK){let off=0;const R=70,C=2*Math.PI*R;
 const a=items.map((c,i)=>{const l=c.v/tot*C,s=`<circle r="${R}" cx="110" cy="110" fill="none" stroke="${COL[i%10]}" stroke-width="${selK==c.k?36:28}" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 110 110)" opacity="${selK&&selK!=c.k?.3:1}"/>`;off+=l;return s}).join('');
 return `<svg viewBox="0 0 220 220" style="max-width:300px;margin:auto">${a}<text x="110" y="108" text-anchor="middle" style="font-size:24px;font-weight:700;fill:var(--ink)">${f(tot,0)}</text><text x="110" y="130" text-anchor="middle" style="font-size:13px">جمع</text></svg>`+leg(items.map((c,i)=>[`${c.k} ${f(c.v/tot*100,0)}٪`,COL[i%10]]))}
function draw(){const M=D.months[mk],all=M.cats;
 document.querySelectorAll('#tabs button').forEach(b=>b.className=b.dataset.t==tab?'on':'');
 $('flt').hidden=(tab=='sl'||tab=='pr');
 $('cat').innerHTML='<option value="">همه دسته‌ها</option>'+all.map(c=>`<option>${c.k}</option>`).join('');$('cat').value=sel;
 if(tab=='rv')return review(M);if(tab=='sl')return sales();if(tab=='pr')return prodTab();
 const vis=all.filter(c=>!over||c.x>c.a),use=sel?all.filter(c=>c.k==sel):vis;
 const A=use.reduce((s,c)=>s+c.a,0),Q=use.reduce((s,c)=>s+(c.q||0),0),X=use.reduce((s,c)=>s+c.x,0),V=X-A,tot=all.reduce((s,c)=>s+c.x,0)||1;
 const mx=Math.max(...vis.map(c=>Math.max(c.a,c.x)),1);
 const bars=vis.map(c=>`<div class="row ${sel&&sel!=c.k?'dim':''}" data-k="${c.k}"><span class="l">${c.k}</span><div class="t"><i class="bud" style="width:${c.a/mx*100}%"></i><i class="act ${c.x>c.a?'over':''}" style="width:${c.x/mx*100}%"></i></div><span class="v">${f(c.x)}</span></div>`).join('')||'<p class="note">دسته‌ای بالاتر از بودجه نیست.</p>';
 const vq=vis.filter(c=>(c.q||0)>0||c.x>0);
 const vert=vchart(vq.map(c=>c.k),[{n:'درخواستی',c:'var(--q)',v:vq.map(c=>c.q||0)},{n:'جذب شده',c:'var(--b)',v:vq.map(c=>c.x),cc:vq.map(c=>c.x>(c.q||0)?'#FF7F0E':null)}]);
 const tp=M.top.map(([n,m])=>[n,sel?(m[sel]||0):Object.values(m).reduce((a,b)=>a+b,0)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,7),tm=Math.max(...tp.map(x=>x[1]),1);
 const days=Object.keys(M.daily).map(Number),ld=days.length?Math.max(...days):1;let cum=0,pts=[];
 for(let d=1;d<=ld;d++){const m=M.daily[d]||{};cum+=sel?(m[sel]||0):Object.values(m).reduce((a,b)=>a+b,0);pts.push(cum)}
 const tq=Math.max(cum,A,1)*1.08,xs=i=>20+i*(600/29),ys=v=>230-v/tq*210;
 const big=[...all].sort((a,b)=>b.x-a.x)[0],ov=[...all].sort((a,b)=>(b.x-b.a)-(a.x-a.a))[0],pa=all.filter(c=>c.a>0).sort((a,b)=>a.x/a.a-b.x/b.a)[0];
 $('view').innerHTML=`<div class="kpis">${kp(f(A,0),'بودجه تخصیص‌یافته')}${kp(f(X),'عملکرد (جذب‌شده)')}${kp((V>0?'+':'')+f(V),'انحراف از تخصیص',V>0)}${kp(A?f(X/A*100)+'٪':'—','درصد مصرف')}${kp(f(M.rev,0),'قلم نیازمند تایید')}</div>
 <div class="grid"><section class="p w2"><h2>بودجه در برابر عملکرد (میلیارد ریال)</h2>${bars}${leg([['تخصیص','var(--q)'],['عملکرد','var(--b)'],['بالاتر از بودجه','var(--o)']])}</section>
 <section class="p w2"><h2>مقایسه بودجه درخواستی و جذب‌شده (میلیارد ریال)</h2>${vert}${leg([['درخواستی','var(--q)'],['جذب شده','var(--b)'],['جذب‌شده بالاتر از درخواستی','var(--o)']])}</section>
 <section class="p"><h2>سهم دسته‌ها از کل جذب</h2>${donut(all.map(c=>({k:c.k,v:c.x})),tot,sel)}</section>
 <section class="p"><h2>طرف‌حساب‌های برتر</h2>${tp.map((x,i)=>`<div class="row" style="cursor:default;grid-template-columns:200px 1fr 84px"><span class="l">${x[0]}</span><div class="t"><i class="act ${i==0?'over':''}" style="width:${x[1]/tm*100}%;height:100%!important;top:0!important"></i></div><span class="v">${f(x[1])}</span></div>`).join('')||'<p class="note">داده‌ای نیست.</p>'}</section>
 <section class="p"><h2>روند تجمعی روزانه در برابر تخصیص</h2><svg viewBox="0 0 640 270"><line class="ax" x1="20" x2="620" y1="${ys(A)}" y2="${ys(A)}" stroke-dasharray="6 4" style="stroke:var(--o)"/><text x="24" y="${ys(A)-6}">تخصیص ${f(A,0)}</text><polyline fill="none" style="stroke:var(--b)" stroke-width="3.5" points="${pts.map((v,i)=>xs(i)+','+ys(v)).join(' ')}"/><text x="20" y="262">۱</text><text x="310" y="262">۱۵</text><text x="600" y="262">۳۰</text></svg></section>
 <section class="p ins"><h2>نکات کلیدی</h2><ul><li>بیشترین مصرف: ${big.k} (${f(big.x/tot*100,0)}٪ از کل)</li><li>بیشترین اضافه‌مصرف: ${ov.k} (${f(ov.x-ov.a)} میلیارد)</li>${pa?`<li>کم‌مصرف‌ترین نسبت به تخصیص: ${pa.k} (${f(pa.x/pa.a*100,0)}٪)</li>`:''}<li>جذب‌شده نسبت به درخواستی: ${Q?f(X/Q*100)+'٪':'—'}</li></ul></section></div>`;
 document.querySelectorAll('.row[data-k]').forEach(r=>r.onclick=()=>{sel=sel==r.dataset.k?'':r.dataset.k;draw()})}
function review(M){$('view').innerHTML=`<div class="kpis">${kp(f(M.rev,0),'قلم نیازمند تایید')}${kp(f(M.revamt),'مبلغ این اقلام (میلیارد ریال)',1)}${kp(f(M.n,0),'کل ردیف‌های پرداخت')}</div><section class="p w2" style="grid-column:auto"><h2>اقلامی که دسته‌شان باید تایید شود</h2><div style="overflow-x:auto"><table><tr><th>تاریخ</th><th>طرف مقابل</th><th>شرح</th><th>مبلغ (میلیارد)</th><th>دسته فعلی</th></tr>${M.rvList.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${f(r[3],2)}</td><td>${r[4]}</td></tr>`).join('')||'<tr><td colspan="5">همه اقلام قطعی هستند.</td></tr>'}</table></div></section>`}
function noProd(){$('view').innerHTML='<section class="p"><h2>داده تولید و فروش پیدا نشد</h2><p class="note">فایل «میزان تولیدات ماهیانه» را در پوشه input بگذارید و update.bat را اجرا کنید.</p></section>'}
const PS=['ورق 8-150','ضایعات سرورق','ضایعات پوسته','اسلب (تختال)','ورق 8-15 (کارمزدی)','پوسته (کارمزدی)'];
const sm=o=>Object.values(o).reduce((a,b)=>a+b,0);
function sales(){const P=D.prod;if(!P)return noProd();const ms=P.months.filter(m=>m.has);if(!ms.length)return noProd();
 const tq={},tv={};PS.forEach(p=>{tq[p]=ms.reduce((s,m)=>s+m.sales[p][0],0);tv[p]=ms.reduce((s,m)=>s+m.sales[p][1],0)});
 const Q=sm(tq),Vt=sm(tv),items=PS.map(p=>({k:p,v:tv[p]})).filter(x=>x.v>0),top=[...items].sort((a,b)=>b.v-a.v)[0];
 const series=PS.map((p,i)=>({n:p,c:COL[i],v:ms.map(m=>m.sales[p][1])})).filter(s=>s.v.some(x=>x>0));
 $('view').innerHTML=`<div class="kpis">${kp(f(Q,0),'کل فروش (تن)')}${kp(f(Vt,0),'مبلغ فروش (میلیارد ریال)')}${kp(f(Vt/Q*1000,0),'میانگین قیمت (میلیون ریال/تن)')}${kp(top.k,'محصول اصلی فروش (از نظر مبلغ)')}</div>
 <div class="grid"><section class="p w2"><h2>مبلغ فروش ماهانه به تفکیک محصول (میلیارد ریال)</h2>${vchart(ms.map(m=>m.name),series,{stacked:true})}${leg(series.map(s=>[s.n,s.c]))}</section>
 <section class="p"><h2>سهم محصولات از مبلغ فروش</h2>${donut(items,Vt)}</section>
 <section class="p"><h2>جدول فروش به تفکیک محصول</h2><div style="overflow-x:auto"><table><tr><th>محصول</th><th>تن</th><th>میلیارد ریال</th><th>قیمت (م.ر/تن)</th></tr>${PS.filter(p=>tq[p]>0).map(p=>`<tr><td>${p}</td><td>${f(tq[p],0)}</td><td>${f(tv[p],0)}</td><td>${f(tv[p]/tq[p]*1000,0)}</td></tr>`).join('')}<tr><th>جمع</th><th>${f(Q,0)}</th><th>${f(Vt,0)}</th><th>${f(Vt/Q*1000,0)}</th></tr></table></div></section></div>
 <p class="note">داده تا ${ms[ms.length-1].name} ۱۴۰۵. طبقه‌بندی ریزتر محصولات بعداً با داده تفکیکی اضافه می‌شود.</p>`}
function prodTab(){const P=D.prod;if(!P)return noProd();const ms=P.months.filter(m=>m.has);if(!ms.length)return noProd();
 const pc=ms.map(m=>sm(m.pc)),pf=ms.map(m=>sm(m.pf)),sq=ms.map(m=>PS.reduce((s,p)=>s+m.sales[p][0],0));
 const TC=pc.reduce((a,b)=>a+b,0),TF=pf.reduce((a,b)=>a+b,0),TS=sq.reduce((a,b)=>a+b,0);
 const mix={};ms.forEach(m=>{Object.entries(m.pc).forEach(([k,v])=>mix[k]=(mix[k]||0)+v)});const items=Object.entries(mix).filter(x=>x[1]>0).map(([k,v])=>({k,v}));
 const raw=ms.filter(m=>m.raw[0]||m.raw[1]);
 $('view').innerHTML=`<div class="kpis">${kp(f(TC,0),'تولید شرکتی (تن)')}${kp(f(TF,0),'تولید کارمزدی (تن)')}${kp(f(TS,0),'فروش کل (تن)')}${kp(TC+TF?f(TS/(TC+TF)*100,0)+'٪':'—','فروش نسبت به تولید')}</div>
 <div class="grid"><section class="p w2"><h2>تولید و فروش ماهانه (تن)</h2>${vchart(ms.map(m=>m.name),[{n:'تولید',c:'var(--b)',v:pc.map((x,i)=>x+pf[i])},{n:'فروش',c:'var(--o)',v:sq}])}${leg([['تولید (شرکتی و کارمزدی)','var(--b)'],['فروش','var(--o)']])}</section>
 <section class="p"><h2>ترکیب تولید شرکتی (تن)</h2>${donut(items,TC)}</section>
 <section class="p"><h2>مواد اولیه (اسلب): رسید انبار و فاکتور</h2><div style="overflow-x:auto"><table><tr><th>ماه</th><th>رسید انبار (تن)</th><th>فاکتور (تن)</th><th>فی (م.ر/تن)</th></tr>${raw.map(m=>`<tr><td>${m.name}</td><td>${f(m.raw[0],0)}</td><td>${f(m.raw[1],0)}</td><td>${m.raw[3]?f(m.raw[3],0):'—'}</td></tr>`).join('')||'<tr><td colspan="4">داده‌ای نیست.</td></tr>'}</table></div></section></div>
 <p class="note">داده تا ${ms[ms.length-1].name} ۱۴۰۵.</p>`}
</script></body></html>
