<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>داشبورد مدیریتی بودجه، تولید و فروش</title>
<style>
:root{--bg:#F4F6FA;--card:#fff;--ink:#1F2A44;--mut:#6B7694;--line:#D5DCE8;--nav:#0B4F8A;--kpi:#2F3A8F;--b:#1B4F8A;--o:#FF7F0E;--track:#E3E8F1;--q:#8FA3BF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0F1626;--card:#18213A;--ink:#E6EBF5;--mut:#9AA6C4;--line:#2B3656;--nav:#0B3A66;--b:#5B9BE0;--track:#26314F;--q:#6C7FA3}}
[hidden]{display:none!important}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",Tahoma,Vazirmatn,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{flex:none;background:var(--nav);color:#fff;padding:10px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h1{margin:0;font-size:22px}.dates{display:flex;gap:22px;font-size:13px}.dates div{display:flex;flex-direction:column;align-items:center;line-height:1.35}.dates span{opacity:.8;font-size:12px}.dates b{font-weight:600;font-size:14px}.hr{display:flex;gap:10px;align-items:center}.prt{font:inherit;font-size:15px;color:var(--nav);background:#fff;border:2px solid #fff;border-radius:16px;padding:6px 20px;cursor:pointer;font-weight:700}.pronly{display:none;font-size:14px;opacity:.9}
.tabs{display:flex;gap:10px}.tabs button{font:inherit;font-size:15px;color:#fff;background:transparent;border:2px solid #fff;border-radius:16px;padding:6px 20px;cursor:pointer;font-weight:600}
.tabs button.on{background:#fff;color:var(--nav)}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 24px 14px}
.filters{flex:none;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.f{border:2px solid var(--b);border-radius:12px;padding:3px 12px;background:var(--card)}.f label{display:block;color:var(--b);font-weight:700;font-size:13px}
.f select{border:0;background:transparent;color:var(--ink);font:inherit;min-width:180px}.f.chk{display:flex;gap:10px;align-items:center;font-weight:600;padding:9px 12px}
.reset{font:inherit;color:var(--b);background:transparent;border:2px solid var(--b);border-radius:12px;padding:9px 20px;cursor:pointer;font-weight:600}
.ghost{margin-inline-start:auto;font:inherit;font-size:13px;color:var(--mut);background:none;border:0;cursor:pointer;text-decoration:underline;padding:4px 8px}
#view{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.kpis{flex:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--kpi);color:#fff;border-radius:34px;padding:10px 8px;text-align:center}.kpi b{display:block;font-size:32px;line-height:1.25}.kpi span{font-size:14px;opacity:.92}.kpi.hot b{color:#FFB066}
.g12{flex:1;min-height:0;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:12px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c8{grid-column:span 8}.c12{grid-column:1/-1}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.p h2{flex:none;margin:0 0 6px;font-size:16px;text-align:center}.pb{flex:1;min-height:0;overflow:auto}
.hb{display:flex;flex-direction:column;justify-content:space-evenly;height:100%}
.row{display:grid;grid-template-columns:140px 1fr 62px;gap:10px;align-items:center;cursor:pointer}.row.dim{opacity:.35}.row:hover .l{text-decoration:underline}
.t{height:20px;background:var(--track);border-radius:6px;position:relative}.t i{position:absolute;right:0;border-radius:6px;top:0;height:100%}
.bud{background:var(--mut);opacity:.45}.act{height:10px!important;top:5px!important;background:var(--b)}.act.over{background:var(--o)}
.l{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.v{font-size:14px;text-align:left;font-variant-numeric:tabular-nums;font-weight:600}
.leg{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:4px;flex:none}.leg s{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:5px;text-decoration:none}
.pb>svg{width:100%;height:100%}svg text{fill:var(--mut);font-size:12px}svg .vl{fill:var(--ink);font-size:12px;font-weight:600}svg .ax{stroke:var(--line)}
.br{display:flex;justify-content:space-between;padding:3px 2px;border-bottom:1px solid var(--line);font-size:14px}.br b{font-variant-numeric:tabular-nums}.br.dim{opacity:.35}.neg{color:var(--o)}.br.tot{border-bottom:0;font-weight:700;color:var(--b);margin-top:2px}
.dn{display:flex;align-items:center;gap:10px;height:100%}.dn svg{flex:0 0 46%;width:46%;height:auto;max-height:100%}.dl{flex:1;font-size:13px;line-height:1.75}.dl div{white-space:nowrap}.dl s{display:inline-block;width:11px;height:11px;border-radius:3px;margin-left:6px;text-decoration:none}.dl b{float:left}
.ins{display:flex;flex-direction:column;justify-content:space-evenly;height:100%}.ins div{background:var(--bg);border-radius:8px;padding:8px 12px;color:var(--b);font-weight:600;font-size:14px}
.adv{margin:0;padding:0 16px 0 0;font-size:13.5px;line-height:1.65}.adv li{margin-bottom:7px}.big table th,.big table td{font-size:15px;padding:4px 10px}.note{color:var(--mut);font-size:13px;margin:8px 0;text-align:center}
table{width:100%;border-collapse:collapse}th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;font-size:14px}th{color:var(--b)}
#login{position:fixed;inset:0;background:var(--nav);display:flex;align-items:center;justify-content:center;z-index:9}
#login form{background:var(--card);padding:34px;border-radius:16px;width:min(400px,90vw);text-align:center}
#login input{width:100%;padding:12px;margin:14px 0;border:2px solid var(--b);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
#login button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--kpi);color:#fff;font:inherit;font-weight:700;cursor:pointer}
#err{color:#C0392B;min-height:20px}
@media screen and (max-height:800px),screen and (max-width:1100px){body{height:auto;overflow:auto}main{display:block}#view{display:block}.g12{display:block}.p{min-height:300px;margin-top:12px}.kpis{margin-bottom:4px}.row{grid-template-columns:120px 1fr 60px}}
@page{size:A4 landscape;margin:7mm}
@media print{:root{--bg:#fff;--card:#fff;--ink:#1F2A44;--mut:#6B7694;--line:#D5DCE8;--nav:#0B4F8A;--b:#1B4F8A;--track:#E3E8F1;--q:#8FA3BF}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{height:auto}body{width:1500px;height:1000px;overflow:hidden;zoom:.7;display:flex;flex-direction:column}
.noprint,#flt,.ghost{display:none!important}.pronly{display:block!important}header{padding:8px 24px}}
</style></head><body>
<div id="login"><form id="lf"><h2 style="margin:0">داشبورد مدیریتی</h2><p class="note">برای دیدن داده‌ها رمز را وارد کنید.</p>
<input type="password" id="pw" autocomplete="current-password" placeholder="رمز عبور" aria-label="رمز عبور"><div id="err" role="alert"></div><button>ورود</button></form></div>
<header><div><h1>داشبورد بودجه، تولید و فروش</h1><div id="ptitle" class="pronly"></div></div><div class="dates" id="upd"></div><div class="hr noprint"><div class="tabs" id="tabs"></div><button class="prt" id="prt">چاپ</button></div></header>
<main id="app" hidden>
<div class="filters" id="flt">
<div class="f"><label for="mon">ماه</label><select id="mon"></select></div>
<div class="f"><label for="cat">دسته</label><select id="cat"></select></div>
<div class="f chk"><input type="checkbox" id="over" style="width:18px;height:18px"><label for="over" style="color:var(--ink)">فقط بالاتر از بودجه</label></div>
<button class="reset" id="rs">پاک‌کردن فیلترها</button><button class="ghost" id="rvbtn"></button></div>
<div id="view"></div></main>
<script>
const $=s=>document.getElementById(s),f=(n,d=1)=>Number(n).toLocaleString('fa-IR',{maximumFractionDigits:d});
const COL=['#1B4F8A','#FF7F0E','#3B3F9E','#0F8BFF','#6A0F7A','#E5703A','#2E9E8F','#8FA3BF','#C0392B','#F2B134'];
const TABS=[['ov','بودجه'],['pr','تولید'],['sl','فروش'],['ad','مشاور مدیریتی']];
let D,sel='',over=false,tab='ov',mk='';
async function dec(pw){const e=await (await fetch('data.enc?'+Date.now())).json(),b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(e.s),iterations:e.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(e.i)},k,b(e.c))))}
async function open_(pw){try{D=await dec(pw);sessionStorage.setItem('k',pw)}catch(x){sessionStorage.removeItem('k');$('err').textContent='رمز نادرست است یا داده در دسترس نیست.';return}
 $('login').hidden=true;$('app').hidden=false;init()}
$('lf').onsubmit=e=>{e.preventDefault();open_($('pw').value)};
const sk=sessionStorage.getItem('k');if(sk)open_(sk);
const pd=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]),jd=d=>d.toLocaleDateString('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'});
function stamp(){const u=new Date(String(D.updated).replace(' ','T'));$('upd').innerHTML=`<div><span>امروز</span><b>${jd(new Date())}</b></div><div><span>آخرین تغییرات</span><b>${isNaN(u)?'—':jd(u)+' '+u.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}</b></div><div><span>آخرین تراکنش</span><b>${pd(D.lastTx)}</b></div>`}
function init(){stamp();$('prt').onclick=()=>window.print();
 mk=[...D.order].reverse().find(m=>D.months[m].n>0)||D.order[D.order.length-1];$('mon').innerHTML=D.order.map(m=>`<option value="${m}">${D.months[m].label}</option>`).join('');$('mon').value=mk;
 $('mon').onchange=()=>{mk=$('mon').value;sel='';draw()};
 $('tabs').innerHTML=TABS.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join('');
 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
 $('over').onchange=e=>{over=e.target.checked;draw()};$('cat').onchange=()=>{sel=$('cat').value;draw()};
 $('rs').onclick=()=>{sel='';over=false;$('over').checked=false;draw()};$('rvbtn').onclick=()=>{tab='rv';draw()};draw()}
const kp=(b,s,h)=>`<div class="kpi ${h?'hot':''}"><b>${b}</b><span>${s}</span></div>`;
const leg=a=>`<div class="leg">${a.map(x=>`<span><s style="background:${x[1]}"></s>${x[0]}</span>`).join('')}</div>`;
const P=(h,inner,cls,foot)=>`<section class="p ${cls||''}"><h2>${h}</h2><div class="pb">${inner}</div>${foot||''}</section>`;
const wrap=(s,n=10)=>{const w=s.split(' '),L=[''];w.forEach(x=>{if((L[L.length-1]+' '+x).trim().length>n&&L[L.length-1])L.push(x);else L[L.length-1]=(L[L.length-1]+' '+x).trim()});return L};
function vchart(labels,series,o={}){const W=o.W||900,H=o.H||300,pl=10,pr=10,pt=24,pb=o.pb||64,n=labels.length,gw=(W-pl-pr)/Math.max(n,1),ns=series.length;
 const tot=labels.map((_,i)=>o.stacked?series.reduce((s,x)=>s+(x.v[i]||0),0):Math.max(...series.map(x=>x.v[i]||0)));
 const mx=Math.max(...tot,1)*1.12,y=v=>pt+(H-pt-pb)*(1-v/mx),bw=o.stacked?gw*.6:gw*.72/ns;let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
 for(let k=0;k<=3;k++){const yy=pt+(H-pt-pb)*k/3;s+=`<line class="ax" x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text x="${W-pr}" y="${yy-3}" text-anchor="end">${f(mx*(1-k/3),0)}</text>`}
 labels.forEach((lb,i)=>{const cx=W-pr-(i+.5)*gw;let base=0;
  series.forEach((sr,j)=>{const v=sr.v[i]||0,x=o.stacked?cx-bw/2:cx-ns*bw/2+(ns-1-j)*bw,y0=o.stacked?y(base+v):y(v),hh=o.stacked?y(base)-y(base+v):y(0)-y(v);
   s+=`<rect x="${x}" y="${y0}" width="${bw}" height="${Math.max(hh,0)}" rx="3" style="fill:${(sr.cc&&sr.cc[i])||sr.c}"><title>${lb} – ${sr.n}: ${f(v,1)}</title></rect>`;
   if(!o.stacked)s+=`<text class="vl" x="${x+bw/2}" y="${y0-4}" text-anchor="middle">${f(v,0)}</text>`;base+=v});
  if(o.stacked&&tot[i]>0)s+=`<text class="vl" x="${cx}" y="${y(tot[i])-4}" text-anchor="middle">${f(tot[i],0)}</text>`;
  wrap(lb,o.wn||10).forEach((ln,k)=>s+=`<text x="${cx}" y="${H-pb+16+k*14}" text-anchor="middle" style="fill:var(--ink)">${ln}</text>`)});
 return s+'</svg>'}
function donut(items,tot,selK){let off=0;const R=70,C=2*Math.PI*R;
 const a=items.map((c,i)=>{const l=c.v/tot*C,s=`<circle r="${R}" cx="110" cy="110" fill="none" stroke="${COL[i%10]}" stroke-width="${selK==c.k?36:28}" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 110 110)" opacity="${selK&&selK!=c.k?.3:1}"/>`;off+=l;return s}).join('');
 return `<div class="dn"><svg viewBox="0 0 220 220">${a}<text x="110" y="110" text-anchor="middle" style="font-size:26px;font-weight:700;fill:var(--ink)">${f(tot,0)}</text><text x="110" y="132" text-anchor="middle" style="font-size:13px">جمع</text></svg><div class="dl">${items.map((c,i)=>`<div><s style="background:${COL[i%10]}"></s>${c.k}<b>${f(c.v/tot*100,0)}٪</b></div>`).join('')}</div></div>`}
function draw(){const M=D.months[mk],all=M.cats;
 $('ptitle').textContent=({ov:'بودجه – '+M.label,rv:'اقلام نیازمند تایید – '+M.label,sl:'فروش',pr:'تولید',ad:'مشاور مدیریتی'})[tab];
 document.querySelectorAll('#tabs button').forEach(b=>b.className=b.dataset.t==tab?'on':'');
 $('flt').hidden=(tab=='sl'||tab=='pr'||tab=='ad');$('rvbtn').textContent='اقلام نیازمند تایید ('+f(M.rev,0)+')';
 $('cat').innerHTML='<option value="">همه دسته‌ها</option>'+all.map(c=>`<option>${c.k}</option>`).join('');$('cat').value=sel;
 if(tab=='rv')return review(M);if(tab=='sl')return sales();if(tab=='pr')return prodTab();if(tab=='ad')return advisor();
 const vis=all.filter(c=>!over||c.x>c.a),use=sel?all.filter(c=>c.k==sel):vis;
 const A=use.reduce((s,c)=>s+c.a,0),Q=use.reduce((s,c)=>s+(c.q||0),0),X=use.reduce((s,c)=>s+c.x,0),V=X-A,R=use.reduce((s,c)=>s+(c.p||0)+c.a-c.x,0),tot=all.reduce((s,c)=>s+c.x,0)||1;
 const mx=Math.max(...vis.map(c=>Math.max(c.a,c.x)),1);
 const pi=D.order.indexOf(mk),PM=pi>0?D.months[D.order[pi-1]]:null,dys=m=>{const d=Object.keys(m.daily).map(Number);return d.length?Math.max(...d):0},e1=dys(M);
 const cumTo=(m,k,e)=>{let t=0;for(let d=1;d<=e;d++){const x=m.daily[d];if(x&&x[k])t+=x[k]}return t},rr=vis.map(c=>({k:c.k,a:cumTo(M,c.k,e1),b:PM?cumTo(PM,c.k,e1):0})),rmx=Math.max(...rr.map(r=>Math.max(r.a,r.b)),.01);
 const bars=PM?rr.map(r=>`<div class="row ${sel&&sel!=r.k?'dim':''}" data-k="${r.k}"><span class="l">${r.k}</span><div class="t"><i class="bud" style="width:${r.b/rmx*100}%"></i><i class="act ${r.b>0&&r.a>r.b*1.1?'over':''}" style="width:${r.a/rmx*100}%"></i></div><span class="v">${r.b>0?sg((r.a/r.b-1)*100)+'٪':'—'}</span></div>`).join(''):'<p class="note">ماه قبل برای مقایسه موجود نیست.</p>';
 const vert=vchart(all.map(c=>c.k),[{n:'درخواستی',c:'var(--q)',v:all.map(c=>c.q||0)},{n:'جذب شده',c:'var(--b)',v:all.map(c=>c.x),cc:all.map(c=>c.x>(c.q||0)?'#FF7F0E':null)}],{W:760,H:300,pb:58,wn:9});
 const rem=all.map(c=>[c.k,(c.p||0)+c.a-c.x]),RT=rem.reduce((s,x)=>s+x[1],0);
 const balp=rem.map(x=>`<div class="br ${sel&&sel!=x[0]?'dim':''}"><span>${x[0]}</span><b class="${x[1]<0?'neg':''}">${f(x[1])}</b></div>`).join('')+`<div class="br tot"><span>جمع مانده بودجه</span><b class="${RT<0?'neg':''}">${f(RT)}</b></div>`;
 const tp=M.top.map(([n,m])=>[n,sel?(m[sel]||0):Object.values(m).reduce((a,b)=>a+b,0)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,7),tm=Math.max(...tp.map(x=>x[1]),1);
 const days=Object.keys(M.daily).map(Number),ld=days.length?Math.max(...days):1;let cum=0,pts=[];
 for(let d=1;d<=ld;d++){const m=M.daily[d]||{};cum+=sel?(m[sel]||0):Object.values(m).reduce((a,b)=>a+b,0);pts.push(cum)}
 const tq=Math.max(cum,A,1)*1.08,xs=i=>14+i*(420/29),ys=v=>212-v/tq*190;
 const big=[...all].sort((a,b)=>b.x-a.x)[0],ov=[...all].sort((a,b)=>(b.x-b.a)-(a.x-a.a))[0],pa=all.filter(c=>c.a>0).sort((a,b)=>a.x/a.a-b.x/b.a)[0];
 $('view').innerHTML=`<div class="kpis">${kp(f(A,0),'بودجه تخصیص‌یافته')}${kp(f(X),'عملکرد (جذب‌شده)')}${kp(f(R),'مانده بودجه',R<0)}</div>
 <div class="g12">${P('مقایسه با ماه قبل تا همین روز (تا روز '+pd(e1)+' ماه)',`<div class="hb">${bars}</div>`,'c4',leg([[PM?PM.label:'ماه قبل','var(--q)'],[M.label,'var(--b)'],['بیش از ۱۰٪ افزایش','var(--o)']]))}
 ${P('مقایسه بودجه درخواستی و جذب‌شده (میلیارد ریال)',vert,'c5',leg([['درخواستی','var(--q)'],['جذب شده','var(--b)'],['جذب‌شده بالاتر از درخواستی','var(--o)']]))}
 ${P('مانده بودجه هر دسته (میلیارد ریال)',balp,'c3')}
 ${P('سهم دسته‌ها از کل جذب',donut(all.map(c=>({k:c.k,v:c.x})),tot,sel),'c3')}

  m1?`حاشیه ناخالص تقریبی (فروش منهای اسلب) ${m1.n}: ${f(pr(m1)-fee(m1.n),0)} میلیون ریال بر تن (${f((pr(m1)-fee(m1.n))/pr(m1)*100,0)}٪ قیمت فروش).`:'',
  `بودجه ${cur.label}: ${f(cx,0)} از ${f(ca,0)} میلیارد (${f(cx/ca*100,0)}٪)؛ بیشترین اضافه‌مصرف ${cov.k} (${sg(cov.x-cov.a)} میلیارد).`,
  'این تحلیل بر پایه قیمت اسلب فاکتورشده است و هزینه انرژی، دستمزد، غلتک و فروش ضایعات را شامل نمی‌شود.'];
 const hr=M.rows;
 $('view').innerHTML=`<div class="g12">${P('سودآوری ضخامت‌ها (تجمعی – مرتب بر اساس سود به‌ازای ساعت نورد)',tbl(['ضخامت','فروش (تن)','قیمت (م.ر/تن)','حاشیه (م.ر/تن)','ضریب نورد','سود/ساعت نورد (میلیارد)'],hr.map((r,i)=>['ضخامت '+T(r.t),f(r.q,0),f(r.p,0),`<span class="${r.sp<0?'neg':''}">${f(r.sp,0)}</span>`,f(r.k,2),`<b ${i==0?'style="color:var(--o)"':''}>${f(r.mh,1)}</b>`])),'c8')}
 ${P('سود ناخالص به‌ازای هر ساعت نورد (میلیارد ریال)',vchart(hr.map(r=>T(r.t)).reverse(),[{n:'سود/ساعت',c:'var(--b)',v:hr.map(r=>r.mh).reverse(),cc:hr.map(r=>r===best?'#FF7F0E':null).reverse()}],{W:520,H:240,pb:30}),'c4')}
 ${P('مشاور تولید',`<ul class="adv">${li(prodL)}</ul>`,'c3')}${P('مشاور فروش',`<ul class="adv">${li(salL)}</ul>`,'c3')}${P('مشاور بازاریابی',`<ul class="adv">${li(mkL)}</ul>`,'c3')}${P('مدیر مالی',`<ul class="adv">${li(finL)}</ul>`,'c3')}</div>`}
</script></body></html>
